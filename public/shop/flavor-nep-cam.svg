<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
<defs>

  <linearGradient id="pot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="55%" stop-color="#fcfbf8"/>
    <stop offset="100%" stop-color="#ebe2d3"/>
  </linearGradient>
  <linearGradient id="kraft-grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ebd1b8"/>
    <stop offset="55%" stop-color="#d9b384"/>
    <stop offset="100%" stop-color="#b38756"/>
  </linearGradient>
  <linearGradient id="leaf-grad" x1="0%" y1="100%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#256b40"/>
    <stop offset="100%" stop-color="#52b788"/>
  </linearGradient>
  <linearGradient id="wood-grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#dcb183"/>
    <stop offset="100%" stop-color="#8d5b2d"/>
  </linearGradient>

  <linearGradient id="nep-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#581c87"/>
    <stop offset="50%" stop-color="#4a154b"/>
    <stop offset="100%" stop-color="#2e0c30"/>
  </linearGradient>
  <linearGradient id="yogurt-top" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="70%" stop-color="#fdfbf7"/>
    <stop offset="100%" stop-color="#f3e8ff"/>
  </linearGradient>
</defs>
  <g id="illustration" transform="translate(300, 300) scale(1.22) translate(-300, -320)">
<!-- Ambient organic watercolor blob -->
  <circle cx="300" cy="320" r="220" fill="#f3e8ff" opacity="0.85"/>
  <circle cx="300" cy="320" r="185" fill="#e9d5ff" opacity="0.6"/>

  <!-- Wooden Platter Base -->
  <ellipse cx="300" cy="460" rx="200" ry="45" fill="#c69255" stroke="#8d5b2d" stroke-width="4"/>
  <ellipse cx="300" cy="456" rx="185" ry="38" fill="#ddb080" opacity="0.5"/>

  <!-- The 2-Layer Yogurt Jar -->
  <g transform="translate(300, 340)">
    <!-- Jar Shadow -->
    <ellipse cx="0" cy="98" rx="85" ry="20" fill="#16301f" opacity="0.18"/>

    <!-- Bottom Layer: Fermented Black Sticky Rice (Nep Cam) -->
    <path d="M -94 25 
             C -90 75 -55 100 0 100 
             C 55 100 90 75 94 25 
             Q 45 35 0 25 
             Q -45 15 -94 25 Z" 
          fill="url(#nep-bottom)"/>

    <!-- Sticky Rice Grains texture inside purple layer -->
    <g fill="#d8b4e2" opacity="0.85">
      <ellipse cx="-45" cy="50" rx="6" ry="3" transform="rotate(-15 -45 50)"/>
      <ellipse cx="-20" cy="65" rx="6" ry="3" transform="rotate(20 -20 65)"/>
      <ellipse cx="15" cy="55" rx="6" ry="3" transform="rotate(-30 15 55)"/>
      <ellipse cx="45" cy="65" rx="6" ry="3" transform="rotate(15 45 65)"/>
      <ellipse cx="-5" cy="80" rx="6" ry="3" transform="rotate(5 -5 80)"/>
      <ellipse cx="-60" cy="68" rx="5" ry="2.5" transform="rotate(35 -60 68)"/>
      <ellipse cx="60" cy="48" rx="5" ry="2.5" transform="rotate(-25 60 48)"/>
    </g>

    <!-- Top Layer: Velvet White Yogurt with wavy transition -->
    <path d="M -65 -50 
             C -90 -50 -105 -20 -102 30 
             L -94 25 
             Q -45 15 0 25 
             Q 45 35 94 25 
             L 102 30 
             C 105 -20 90 -50 65 -50 Z" 
          fill="url(#yogurt-top)"/>

    <!-- Outer Jar Contour Stroke -->
    <path d="M -65 -50 
             C -90 -50 -105 -20 -102 30 
             C -98 80 -60 100 0 100 
             C 60 100 98 80 102 30 
             C 105 -20 90 -50 65 -50 Z" 
          fill="none" 
          stroke="#16301f" 
          stroke-width="5.5" 
          stroke-linejoin="round"/>

    <!-- Glass gloss reflection -->
    <path d="M -80 -10 C -85 25 -82 60 -65 80 C -68 70 -72 30 -66 -10 Z" fill="#ffffff" opacity="0.75"/>
    <circle cx="-60" cy="-25" r="4" fill="#ffffff" opacity="0.85"/>

    <!-- Jar Rim & Opening -->
    <ellipse cx="0" cy="-50" rx="65" ry="18" fill="#ffffff" stroke="#16301f" stroke-width="5"/>
    <ellipse cx="0" cy="-50" rx="58" ry="14" fill="#ffffff"/>

    <!-- A few purple rice grains sprinkled on top -->
    <ellipse cx="-15" cy="-52" rx="4" ry="2" fill="#581c87"/>
    <ellipse cx="12" cy="-48" rx="4" ry="2" fill="#581c87"/>
    <ellipse cx="0" cy="-55" rx="3.5" ry="2" fill="#581c87"/>

    <!-- Golden Rice Stalk beside jar -->
    <g transform="translate(100, 50)">
      <path d="M 0 30 Q 25 -10 15 -45" stroke="#ca8a04" stroke-width="3" fill="none"/>
      <ellipse cx="12" cy="-30" rx="6" ry="3" fill="#eab308" transform="rotate(-35 12 -30)"/>
      <ellipse cx="18" cy="-40" rx="6" ry="3" fill="#eab308" transform="rotate(-35 18 -40)"/>
      <ellipse cx="5" cy="-20" rx="6" ry="3" fill="#eab308" transform="rotate(-35 5 -20)"/>
    </g>

    <!-- Wooden Spoon lifting both layers on left -->
    <g transform="translate(-105, 10) rotate(-22)">
      <path d="M -4 20 L -2 -90 Q 0 -95 4 -95 Q 8 -95 6 -90 L 4 20 Z" fill="#c69255" stroke="#8d5b2d" stroke-width="2.5"/>
      <ellipse cx="0" cy="25" rx="18" ry="26" fill="#c69255" stroke="#8d5b2d" stroke-width="3"/>
      <!-- 2-layer spoonful: purple bottom, white top -->
      <path d="M -13 22 Q 0 38 13 22 Q 0 10 -13 22 Z" fill="#ffffff" stroke="#16301f" stroke-width="2"/>
      <path d="M -11 25 Q 0 38 11 25 Q 0 20 -11 25 Z" fill="#581c87"/>
    </g>
  </g>

  <!-- Sparkles -->
  <path d="M 140 152 Q 140 160 148 160 Q 140 160 140 168 Q 140 160 132 160 Q 140 160 140 152 Z" fill="#7e22ce"/>
  <path d="M 470 151 Q 470 160 479 160 Q 470 160 470 169 Q 470 160 461 160 Q 470 160 470 151 Z" fill="#7e22ce"/>
  <path d="M 490 353 Q 490 360 497 360 Q 490 360 490 367 Q 490 360 483 360 Q 490 360 490 353 Z" fill="#7e22ce"/>
  <path d="M 120 373 Q 120 380 127 380 Q 120 380 120 387 Q 120 380 113 380 Q 120 380 120 373 Z" fill="#7e22ce"/>
  </g>
</svg>
